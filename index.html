<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase JS Client via CDN -->
    <link rel="icon" href="tienda-online.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="tienda-online.png" sizes="180x180">
</head>
<body>

    <header>
        <h1>Lista de Compras</h1>
    </header>

    <nav class="tabs-nav">
        <button class="tab-btn active" data-tab="agregar">Agregar</button>
        <button class="tab-btn" data-tab="pendientes">Pendientes</button>
        <button class="tab-btn" data-tab="historial">Historial</button>
    </nav>

    <main class="container">
        <!-- SECCIÓN 1: Agregar Producto -->
        <section id="tab-agregar" class="tab-content active">
            <div class="card">
                <h2>Nuevo Producto</h2>
                <p class="hint">Escribe de forma natural. Ej: <em>Queso 1 y medio kg</em>, <em>2 L Leche</em>, <em>Pan 3 unid</em></p>
<!-- Reemplaza el <form id="form-agregar">...</form> actual por este: -->
<form id="form-agregar" class="form-grid">
    <div class="form-group input-nombre">
        <label for="input-nombre">Producto</label>
        <input type="text" id="input-nombre" placeholder="Ej. Harina PAN" required autocomplete="off">
    </div>

    <div class="form-group input-cantidad">
        <label for="input-cantidad">Cantidad</label>
        <input type="number" id="input-cantidad" step="0.5" min="0.5" value="1" required>
    </div>

    <div class="form-group input-unidad">
        <label for="select-unidad">Unidad</label>
        <select id="select-unidad">
            <option value="unid">Unidades (unid)</option>
            <option value="kg">Kilogramos (kg)</option>
            <option value="gr">Gramos (gr)</option>
            <option value="lt">Litros (lt)</option>
            <option value="paq">Paquetes (paq)</option>
        </select>
    </div>

    <button type="submit" class="btn-submit">Agregar</button>
</form>
<div id="feedback" class="feedback"></div>
            </div>
        </section>

        <!-- SECCIÓN 2: Lista de Compras (Pendientes) -->
        <section id="tab-pendientes" class="tab-content">
            <h2>Productos Pendientes</h2>
            <ul id="lista-pendientes" class="item-list">
                <li class="empty-state">Cargando productos...</li>
            </ul>
        </section>

        <!-- SECCIÓN 3: Historial -->
        <section id="tab-historial" class="tab-content">
            <h2>Historial de Compras</h2>
            <ul id="lista-historial" class="item-list">
                <li class="empty-state">Cargando historial...</li>
            </ul>
        </section>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="app.js"></script>
</body>
</html>
